dataset:
  name: platoon_joint_bev_diagnostic64_round13_71
  output_root: /tmp/bev-round13-71

split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 17

collection:
  target_joint_steps: 64
  start_seed: 17
  max_episodes: 0
  max_episode_steps: 200
  resume: false
  scenario_weights:
    S5_hard_brake_lead: 1.0
    S6_background_merge_in: 1.0
    S7_ego_merge_from_ramp: 1.0
    S8_ego_exit_to_ramp: 1.0
    S9_narrow_channel_negotiation: 1.0
  traffic_density_min: 0.0
  traffic_density_max: 0.0

diagnostic_64:
  enabled: true
  scenario_quotas:
    S5_hard_brake_lead: 13
    S6_background_merge_in: 13
    S7_ego_merge_from_ramp: 13
    S8_ego_exit_to_ramp: 13
    S9_narrow_channel_negotiation: 12
  sample_offsets_after_trigger_s: [0.0, 1.0]
  max_attempts_per_scenario: 20

env_config:
  num_agents: 3
  horizon: 200
  observation_mode: bev_gt
  use_render: false
  image_observation: false
  image_on_cuda: false
  sensors: {}
  target_speed_km_h: 30.0
