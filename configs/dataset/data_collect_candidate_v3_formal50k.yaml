dataset:
  name: platoon_joint_bev
  sidecar_name: riskentry_actor_sidecar
  output_root: /media/kong/Elements_SE/Diffusion_Data/metadrive_datasets/bev_joint_risk_candidate_v3_formal50k_v1
  scenario_contract: candidate_v3

split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 17

collection:
  target_joint_steps: 50000
  start_seed: 71017
  max_episodes: 1000
  max_episode_steps: 200
  scenario_max_episode_steps:
    S9_narrow_channel_negotiation: 800
  resume: true
  scenario_weights:
    S5_hard_brake_lead: 1.0
    S6_background_merge_in: 1.0
    S7_ego_merge_from_ramp: 1.0
    S8_ego_exit_to_ramp: 1.0
    S9_narrow_channel_negotiation: 1.0
  traffic_density_min: 0.0
  traffic_density_max: 0.0

formal_pilot:
  enabled: true
  scenario_quotas:
    S5_hard_brake_lead: 10000
    S6_background_merge_in: 10000
    S7_ego_merge_from_ramp: 10000
    S8_ego_exit_to_ramp: 10000
    S9_narrow_channel_negotiation: 10000
  max_attempts_per_scenario: 200
  min_episodes_per_scenario: 50
  max_samples_per_episode: 200
  require_all_scenarios_in_each_split: true
  required_spawn_seeds: [17, 23, 31, 47, 59]
  required_incidental_background_actor_counts: [3, 4, 5, 6]
  required_behavior_categories:
    S5_hard_brake_lead:
      - keep_emergency_braking
      - temporary_formation_release_and_recovery
    S6_background_merge_in:
      - agent0-agent1
      - agent1-agent2
    S7_ego_merge_from_ramp:
      - pass_first
      - yield_then_merge
    S8_ego_exit_to_ramp:
      - agent0-agent1
      - agent1-agent2
    S9_narrow_channel_negotiation:
      - agent0-agent1
      - agent1-agent2

env_config:
  num_agents: 3
  horizon: 200
  observation_mode: bev_gt
  use_render: false
  image_observation: false
  image_on_cuda: false
  sensors: {}
  target_speed_km_h: 30.0
