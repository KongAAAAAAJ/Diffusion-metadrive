pretrained_ckpt: /media/kong/Elements_SE/Diffusion_Data/outputs/diffusion/run_20/checkpoints/diffusion-epoch=25.ckpt
resume_grpo_ckpt: ""  # path to GRPO ckpt dir; overrides cls_branch init and ref weights (Strategy B)
model_config_path: configs/diffusion/model.yaml
num_agents: 3
output_root: /media/kong/Elements_SE/Diffusion_Data/outputs/plan_cls_grpo

total_timesteps: 100000
learning_rate: 1.0e-4
max_grad_norm: 1.0
beta_kl: 0.1             # KL weight vs pretrained cls_branch
use_mode_valid_mask: false  # false: sampling and loss use all M modes without masking
plan_cls_clip_range: 0.2
plan_cls_update_epochs: 1
plan_cls_max_log_ratio: 5.0

# ── proxy reward ────────────────────────────────────────────────────────────
desired_gap_m: 10.0   # desired follow distance → lon/lat error reference (m)
progress_s_max: 15.0  # expected max forward x-displacement (m) for r_progress normalisation
# per-component weights (defaults match function signature):
# w_lon: 0.5  lon_decay_m: 5.0  w_lat: 0.5  lat_decay_m: 1.0
# w_speed: 1.0  w_progress: 1.0

ckpt_top_k: 3
checkpoint_interval_steps: 5000

env_config:
  num_agents: 3
  observation_mode: multimodal
  use_render: false
  image_on_cuda: false  # must be false for multi-agent (MetaDrive asserts image_on_cuda=false in multi-agent mode)
  planner_device: cuda
  lookahead_index: 2
  target_speed_km_h: 30.0
  controller_type: stabilized
  scenario_ids:
    - S1_free_cruise_straight
    - S2_free_cruise_curve
    # - S3_straight_following
    # - S4_curve_following
