pretrained_ckpt: /media/kong/Elements_SE/Diffusion_Data/outputs/diffusion/run_20/checkpoints/diffusion-epoch=25.ckpt
model_config_path: configs/diffusion/model.yaml
num_agents: 3
output_root: /media/kong/Elements_SE/Diffusion_Data/outputs/mode_cls_ppo

total_timesteps: 200000
n_steps: 256
batch_size: 256   # ≤ n_steps × n_envs = 256 × 1
n_epochs: 4
learning_rate: 3.0e-4
gamma: 0.99
lambda_kl: 0  # 0.02

num_modes: 16
global_state_dim: 60
relation_input_dim: 12
relation_dim: 32
trajectory_embed_dim: 128
actor_hidden_dims: [256, 128]
value_hidden_dim: 256
ckpt_top_k: 3
checkpoint_interval_steps: 10000   # save checkpoint every N timesteps (not every rollout)

num_envs: 1                        # MetaDrive uses a global engine singleton; only 1 env per process
trajectory_source: coarse       # diffusion: use guided diffusion planner candidates (default)
                                   # coarse: skip diffusion, execute coarse kinematic trajectory directly
use_action_mask: false              # false: all modes selectable; invalid slots filled with keep-lane fallback
debug_logging: false               # set true to write per-step JSONL debug log
ppo_device: cuda                   # MaskablePPO policy device (independent of planner_device)

env_config:
  num_agents: 3
  observation_mode: multimodal
  use_render: false
  planner_device: cuda
  lookahead_index: 2
  target_speed_km_h: 30.0
  controller_type: stabilized
  scenario_ids:
    - S1_free_cruise_straight
    - S2_free_cruise_curve
    - S3_straight_following
    - S4_curve_following
