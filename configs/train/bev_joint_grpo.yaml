run:
  variant: A
  run_mode: smoke
  source_checkpoint: /media/kong/Elements_SE/Diffusion_Data/outputs/bev_diffusion_stage1/run_3/checkpoints/best.pt

online:
  device: cuda
  seed: 17
  trajectories_per_mode: 48
  total_rollout_groups: 500
  max_sampling_attempts_per_state: 3
  max_sampling_attempts_multiplier: 3
  resume_checkpoint: null
  validation_state_bank: /media/kong/Elements_SE/Diffusion_Data/outputs/bev_diffusion_stage1/run_3/grpo_open/validation_state_bank_v1.pt
  environment_steps_per_episode: 200
  rollout_groups_per_bucket_visit: 10
  rollout_start_offset_max_steps: 200
  rollout_start_min_remaining_steps: 10
  validation_interval_rollouts: 20
  advantage_vector_log_interval_rollouts: 10
  scenario_seeds: [17, 23]
  scenarios:
    - {scenario: S5_hard_brake_lead, route: R1_entry_straight}
    - {scenario: S6_background_merge_in, route: R6_mainline_merge_approach}
    - {scenario: S7_ego_merge_from_ramp, route: R7_merge_core}
    - {scenario: S8_ego_exit_to_ramp, route: R6_exit_to_ramp}
    - {scenario: S9_narrow_channel_negotiation, route: R8_narrow_channel}
