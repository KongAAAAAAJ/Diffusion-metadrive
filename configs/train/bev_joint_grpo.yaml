run:
  variant: A
  run_mode: smoke
  source_checkpoint: /media/kong/Elements_SE/Diffusion_Data/outputs/bev_diffusion_stage1/run_3/checkpoints/best.pt
online:
  device: cuda
  seed: 23
  trajectories_per_mode: 48
  # Keep this diagnostic run short first. Restore the formal budget after the
  # safety post-training mechanism is verified.
  total_rollout_groups: 10
  max_sampling_attempts_per_state: 3
  max_sampling_attempts_multiplier: 3
  resume_checkpoint: null
  validation_state_bank: /media/kong/Elements_SE/Diffusion_Data/outputs/bev_diffusion_stage1/run_3/grpo_open/validation_state_bank_v1.pt
  environment_steps_per_episode: 200
  rollout_groups_per_bucket_visit: 10
  rollout_start_offset_max_steps: 200
  rollout_start_min_remaining_steps: 10
  validation_interval_rollouts: 20
  advantage_vector_log_interval_rollouts: 10
  scenario_seeds: [17, 23]
  scenarios:
    - {scenario: S5_hard_brake_lead, route: R1_entry_straight}
    - {scenario: S6_background_merge_in, route: R6_mainline_merge_approach}
    - {scenario: S7_ego_merge_from_ramp, route: R7_merge_core}
    - {scenario: S8_ego_exit_to_ramp, route: R6_exit_to_ramp}
    - {scenario: S9_narrow_channel_negotiation, route: R8_narrow_channel}

# Unified safety post-training switch.
# mode: none                          -> original GRPO baseline.
# mode: feasibility_loss              -> existing time-varying feasibility soft loss.
# mode: risk_pact_lite                -> GRPO + final-x0 Risk-PACT-lite curriculum distillation.
# mode: feasibility_plus_risk_pact    -> GRPO + feasibility + Risk-PACT-lite.
safety_post_training:
  mode: risk_pact_lite

  feasibility:
    loss_weight: 0.01
    steering_weight: 1.0
    steering_rate_weight: 1.0
    wheelbase_m: 5.6
    trajectory_dt_s: 0.5
    min_segment_length_m: 0.2
    steering_initial_limit_deg: 48.24
    steering_final_limit_deg: 24.13
    steering_rate_initial_limit_deg_s: 120.0
    steering_rate_final_limit_deg_s: 60.0
    schedule_power: 1.0

  risk_pact:
    distill_weight: 1.0
    horizon_dt_s: 0.5

    # Step 5.6 multi-source safety field. Keep these switches explicit so the
    # three sources can later be ablated independently.
    components:
      background_actor: true
      platoon_actor: true
      road_boundary: true

    # Step 5.6: physically interpretable signed-clearance actor field.
    # Geometry is aligned with VehicleModeRewardConfig / mode_contract.
    actor:
      ego_length_m: 5.74
      ego_width_m: 2.30
      background_longitudinal_clearance_m: 5.0
      background_lateral_clearance_m: 0.4
      temperature_m: 0.50
      softmax_beta: 12.0

    platoon:
      vehicle_length_m: 5.74
      vehicle_width_m: 2.30
      longitudinal_clearance_m: 7.0
      lateral_clearance_m: 0.4

    # Smooth-max across background/platoon/road components.
    component_softmax_beta: 12.0

    road:
      safety_margin_m: 0.4
      temperature_m: 0.30

    temporal_softmax_beta: 12.0
    risk_threshold: 0.35
    violation_temperature: 0.04
    safe_margin: 0.05
    teacher_step_m: 0.20
    gradient_eps: 1.0e-6
    gradient_clip_norm: 10.0

    curriculum:
      start_scale: 0.2
      end_scale: 1.0
      warmup_updates: 0
      ramp_updates: 100
      schedule: linear

    visualization:
      # Disabled in Step 5.6 because the legacy visualizer still assumes the
      # Gaussian field. Step 6 will replace it with clearance-field plots.
      enabled: false
      interval_steps: 5
      start_step: 0
      max_events: 5
      batch_index: 0
      role_index: 0
      mode_index: 0
      output_subdir: risk_field_visualizations
